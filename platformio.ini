; PlatformIO Project Configuration File — VietHUD (formerly radar_car)
;
; Phase 1 (board bring-up): LCD + Touch + LVGL demo on bare ESP32-S3 JC3248W535.
; See docs/radar_car_V1.1_spec.md Phase 1 for that original bring-up history.

[platformio]
boards_dir = boards
; env:viethud is the actual product build (GPS-only offline speed-limit/
; camera/sign warning device — real GNSS+Dashboard+Settings, see
; src/main_viethud.cpp) — env:jc3248w535 still builds the original Phase-1
; bring-up stub (src/main.cpp), now kept only as an isolated hardware-
; recovery diagnostic (same role as env:rawtest), not the current product.
; Defaulting a bare `pio run`/`pio run -t upload` here to the real build
; instead of that stub. Explicitly naming an env (-e jc3248w535 / -e
; viethud) still works exactly as before either way. Radar (HLK-LD2451) was
; removed entirely 2026-09-21 — see README.md for what this project is now.
default_envs = viethud

[env:jc3248w535]
; Pinned to an exact registry version — do not leave unversioned. pioarduino
; (see env:uidemo3, now abandoned — docs/V1.2_hardening_proposal.md "Thử
; nghiệm esp_lcd") installs its platform under the SAME local name
; "espressif32", silently replacing whatever unversioned "platform =
; espressif32" resolves to project-wide and breaking this env's framework
; version. Confirmed on real hardware 2026-09-14. If env:uidemo3 (or any
; pioarduino env) is ever rebuilt, re-verify this platform version is intact.
platform = espressif32@7.1.3
board = esp32-s3-n16r8v
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
; map/SpeedLimitMap.cpp excluded here too — see env:viethud's own comment on
; the same exclusion below; it references pins pincfg.h no longer defines.
; Only the stand-alone bring-up app: it uses nothing from src/ but its own
; main.cpp (display + touch libs). It used to compile ALL of src/ (+<*>),
; which stopped building once the product modules needed libraries this env
; doesn't pull in (ESP8266Audio).
build_src_filter = -<*> +<main.cpp> +<ui/fonts/lv_font_vn_14.c> ; lv_conf.h's LV_FONT_DEFAULT
build_flags =
    -I include
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=0
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Default QSPI DMA chunk is 1024 px (2KB) -> ~150 polling transactions per
    ; full 480x320 flush, each with fixed CS/setup overhead. 8192 px (16KB)
    ; cuts that to ~19 transactions; still tiny vs available internal DMA RAM
    ; (32KB total for the driver's double buffer). Confirmed real hardware
    ; touch/drag felt sluggish even after fixing I2C speed + indev poll rate
    ; (2026-09-14) — this targets the remaining full-frame-flush cost itself.
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    lvgl/lvgl@9.2.2
    mikalhart/TinyGPSPlus@1.1.0

; Diagnostic-only build (no LVGL) to isolate display/backlight/reset issues
; from LVGL flush/buffer wiring. See src/main_rawtest.cpp.
[env:rawtest]
extends = env:jc3248w535
build_src_filter = -<*> +<main_rawtest.cpp>
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0

; VietHUD product build — GPS-only offline speed-limit/camera/sign warning
; device (real GNSS, offline microSD map, Dashboard/Settings, tone+voice
; audio alerts). Radar (HLK-LD2451) was removed entirely 2026-09-21 — see
; README.md and src/main_viethud.cpp. Renamed from env:uidemo at the same
; time (was a "UI verification demo" name from when this sat alongside a
; still-being-bootstrapped Phase-1 stub; that framing no longer applies now
; that this IS the product).
[env:viethud]
extends = env:jc3248w535
; Modular pieces split out of the old monolithic main file — see
; docs/V1.2_hardening_proposal.md plan / C:\Users\phamq\.claude\plans\idempotent-herding-zebra.md
; map/SpeedLimitMap.cpp excluded: retired first-pass (CSV/SD.h+SPIClass)
; superseded by map/SdCardManager.cpp + map/SpeedLimitManager.cpp — it
; references SD_CS_PIN/SD_MOSI_PIN/SD_SCK_PIN/SD_MISO_PIN, which no longer
; exist in pincfg.h now that the real hardware turned out to need SD_MMC
; pins instead (SD_MMC_CLK_PIN/CMD_PIN/D0_PIN), so it no longer compiles.
; Kept on disk for history, excluded here instead of fixed forward since
; fixing it would just recreate the exact bug this file's replacement
; exists to not have.
; NOTE: this is an explicit ALLOWLIST (`-<*>` first) — a new source directory
; under src/ is silently not compiled until it's listed here, which surfaces
; as undefined-reference link errors, not as a missing file. (The scripted UI
; demo, `demo/`, was removed 2026-09-27.)
; The shared product sources live in [viethud_core] below; each model env adds
; exactly ONE board folder (src/boards/<board>/) and its -DVIETHUD_BOARD_* flag.
build_src_filter = ${viethud_core.src_filter} +<boards/jc3248w535/*>
build_flags =
    ${env:jc3248w535.build_flags}
    -DVIETHUD_BOARD_JC3248W535
; `extends` does NOT merge lib_deps with the parent env — a child that
; declares lib_deps REPLACES it entirely (confirmed against env:rawtest
; below, which re-lists only what it actually needs) — so this repeats
; env:jc3248w535's GFX/lvgl/TinyGPSPlus set and adds ESP8266Audio on top,
; rather than just adding the one new line. ESP8266Audio: real MP3 playback
; for the Vietnamese voice cues (Task E, 2026-09-21) — AudioGeneratorMP3 +
; AudioOutputI2S on the same I2S pins audio/AudioPlayer.cpp's tone generator
; already uses. Pinned to 1.9.9, NOT the latest (2.4.1) — confirmed on real
; build: 2.4.1's AudioOutputI2S.h moved to ESP-IDF's new i2s_std.h driver
; (driver/i2s_std.h), which doesn't exist in this project's pinned
; espressif32@7.1.3 / arduino-esp32 2.0.17 (IDF 4.4.x) toolchain — hard
; compile error (`fatal error: driver/i2s_std.h: No such file or
; directory`). 1.9.9 (2024-09) still uses the legacy driver/i2s.h API this
; project's toolchain actually has, confirmed by reading its
; AudioOutputI2S.cpp before pinning it.
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    lvgl/lvgl@9.2.2
    mikalhart/TinyGPSPlus@1.1.0
    earlephilhower/ESP8266Audio@1.9.9

; Shared VietHUD product sources — everything except the board folder. Every
; model env uses this list unchanged (see docs/VIETHUD_PLATFORM.md).
[viethud_core]
src_filter = -<*> +<main_viethud.cpp> +<core/*> +<ui/fonts/*> +<display/*> +<gnss/*> +<touch/*> +<ui/*> +<net/*> +<map/*> +<log/*> +<audio/*> +<update/*> -<map/SpeedLimitMap.cpp>

; VietHUD 2.8 — same product firmware as env:viethud, built for the LCDwiki
; ES3C28P "2.8inch ESP32-S3 Display" (ESP32-S3 N16R8, ILI9341V 240x320 SPI,
; FT6336G touch, ES8311 codec, SDIO TF slot) with the "P18 Pro" GPS on the
; UART header (GPIO44/43). Board-specific: include/boards/es3c28p/ (pins,
; capabilities, identity, OTA channel) + src/boards/es3c28p/ (board.cpp).
;   pio run -e viethud28 -t upload
[env:viethud28]
extends = env:viethud
build_src_filter = ${viethud_core.src_filter} +<boards/es3c28p/*>
; Serial on the native USB CDC: the inherited UART0 console sits on GPIO43/44,
; which on this board is the GPS header (same fix as the Lite).
build_flags =
    ${env:jc3248w535.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=1
    -DVIETHUD_BOARD_ES3C28P

; VietHUD Lite 1.54" on the shared core (replaces the stand-alone
; apps/lite154 firmware). ST7789 240x240, buttons, "P18 Pro" GPS, no card
; slot: data in the on-chip FFat partition, uploaded from data_lite154/
; (python tools/build_flash_data.py lite154, then python tools/build.py viethud_lite154 uploadfs).
;   pio run -e viethud_lite154 -t upload
[env:viethud_lite154]
extends = env:viethud
board = waveshare_s3_lcd154
board_build.partitions = boards/partitions_lite154.csv
board_build.filesystem = fatfs
build_src_filter = ${viethud_core.src_filter} +<boards/lite154/*>
; Serial on the native USB CDC (as the stand-alone Lite firmware had it): the
; 3.5"'s UART0 console is on GPIO43/44, which on this board IS the GPS header,
; so the inherited CDC_ON_BOOT=0 sent every log line into the GPS module.
build_flags =
    ${env:jc3248w535.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=1
    -DVIETHUD_BOARD_LITE154

; ABANDONED 2026-09-14 — do not build this env. Attempted esp_lcd migration
; (Arduino-ESP32 3.x / IDF 5.x via pioarduino, real partial-area screen
; writes) to fix the Arduino_GFX full-frame-flush ceiling. Seven independent
; hypotheses tried and eliminated on real hardware, screen stayed blank
; throughout — see docs/V1.2_hardening_proposal.md "Thử nghiệm esp_lcd" for
; the full writeup. Also: installing this platform overwrites the OTHER
; envs' shared "espressif32" platform install (pioarduino uses the same
; local platform name) — that's why env:jc3248w535 now pins an exact
; version. Kept only as reference for anyone resuming this investigation
; (needs a logic analyzer; see the doc for next steps).
[env:uidemo3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-n16r8v
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<main_ui_demo_esplcd.cpp>
build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
    lvgl/lvgl@9.2.2

; VietHUD 4.3 — Guition JC4880P443C (ESP32-P4 rev v3.2 + ESP32-C6 Wi-Fi/BLE
; over SDIO, 4.3" ST7701S 480x800 MIPI-DSI, GT911 touch, ES8311, 4-bit microSD).
; Same shared core as the S3 models; the board folder brings its own display
; (MIPI-DSI + PPA x1.5 scaling), touch (GT911 + calibration) and audio-out
; drivers in place of display/DisplayDriver.cpp + touch/*, and the UI is
; scaled x1.5 by ui/UiScale.h. Board config: include/boards/jc4880p443c/.
;
; Different chip family -> pioarduino (Arduino 3.x / IDF 5). BUILD WITH THE
; ISOLATED TOOLCHAIN ONLY: pioarduino needs PlatformIO Core >= 6.2 and
; installing it into the default core dir clobbers the pinned
; espressif32@7.1.3 the S3 envs depend on (see env:uidemo3). From PowerShell
; (IDF tools refuse Git Bash/MSYS):
;   python tools/build.py viethud_p4 [upload|uploadfs]
; board esp32-p4_r3-evboard = rev >= 3.0 silicon; the plain esp32-p4 boards
; produce images this chip (v3.2) cannot run. Use esptool >= 5.
; Data: a microSD card wins; without one the core speedmap comes from the
; 13.5 MB read-only "ffat" partition (partitions_p4_data.csv), image built
; from data_p4/ (tools/build_flash_data.py).
[env:viethud_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4_r3-evboard
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions_p4_data.csv
board_build.filesystem = fatfs
build_src_filter = ${viethud_core.src_filter} -<display/DisplayDriver.cpp> -<touch/*> +<boards/jc4880p443c/*>
; UI design units x1.5 for the native 800x480 panel (see src/ui/UiScale.h)
build_src_flags = -include "$PROJECT_SRC_DIR/ui/UiScale.h"
build_flags =
    -I include
    -DVIETHUD_BOARD_JC4880P443C
    -DVIETHUD_P4=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
lib_ignore =
    AXS15231B_Touch
    esp_lcd_axs15231b
lib_deps =
    lvgl/lvgl@9.2.2
    mikalhart/TinyGPSPlus@1.1.0
    earlephilhower/ESP8266Audio@2.4.1

; Bench variant: no GNSS module -> a simulated car drives the real road
; network (gnss/RoadSim.h, UI shows "SIM"). Never for a car.
[env:viethud_p4_sim]
extends = env:viethud_p4
build_flags =
    ${env:viethud_p4.build_flags}
    -DVIETHUD_ROADSIM_AUTOSTART=1
