; PlatformIO Project Configuration File — radar_car
;
; Phase 1 (board bring-up): LCD + Touch + LVGL demo on bare ESP32-S3 JC3248W535.
; No radar/GNSS/buzzer wired yet — see docs/radar_car_V1.1_spec.md Phase 1.

[platformio]
boards_dir = boards
; env:uidemo is the actual product build (real radar+GNSS+Dashboard+Settings,
; see src/main_ui_demo.cpp) despite the name — env:jc3248w535 still builds
; the original Phase-1 bring-up stub (src/main.cpp), now kept only as an
; isolated hardware-recovery diagnostic (same role as env:rawtest), not the
; current product. Defaulting a bare `pio run`/`pio run -t upload` here to
; the real build instead of that stub. Explicitly naming an env (-e
; jc3248w535 / -e uidemo) still works exactly as before either way.
default_envs = uidemo

[env:jc3248w535]
; Pinned to an exact registry version — do not leave unversioned. pioarduino
; (see env:uidemo3, now abandoned — docs/V1.2_hardening_proposal.md "Thử
; nghiệm esp_lcd") installs its platform under the SAME local name
; "espressif32", silently replacing whatever unversioned "platform =
; espressif32" resolves to project-wide and breaking this env's framework
; version. Confirmed on real hardware 2026-09-14. If env:uidemo3 (or any
; pioarduino env) is ever rebuilt, re-verify this platform version is intact.
platform = espressif32@7.1.3
board = esp32-s3-n16r8v
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
; map/SpeedLimitMap.cpp excluded here too — see env:uidemo's own comment on
; the same exclusion below; it references pins pincfg.h no longer defines.
build_src_filter = +<*> -<main_rawtest.cpp> -<main_ui_demo.cpp> -<main_ui_demo_esplcd.cpp> -<map/SpeedLimitMap.cpp>
build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Default QSPI DMA chunk is 1024 px (2KB) -> ~150 polling transactions per
    ; full 480x320 flush, each with fixed CS/setup overhead. 8192 px (16KB)
    ; cuts that to ~19 transactions; still tiny vs available internal DMA RAM
    ; (32KB total for the driver's double buffer). Confirmed real hardware
    ; touch/drag felt sluggish even after fixing I2C speed + indev poll rate
    ; (2026-09-14) — this targets the remaining full-frame-flush cost itself.
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    lvgl/lvgl@9.2.2
    mikalhart/TinyGPSPlus@1.1.0

; Diagnostic-only build (no LVGL) to isolate display/backlight/reset issues
; from LVGL flush/buffer wiring. See src/main_rawtest.cpp.
[env:rawtest]
extends = env:jc3248w535
build_src_filter = -<*> +<main_rawtest.cpp>
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0

; UI verification demo — simulated radar/GNSS data driving the real Dashboard
; layout/TTC/risk-color/audio-gate/fail-safe logic, so the LVGL UI can be
; checked before Phase 2 real sensors exist. See src/main_ui_demo.cpp.
[env:uidemo]
extends = env:jc3248w535
; Modular pieces being split out of the old monolithic main_ui_demo.cpp — see
; docs/V1.2_hardening_proposal.md plan / C:\Users\phamq\.claude\plans\idempotent-herding-zebra.md
; map/SpeedLimitMap.cpp excluded: retired first-pass (CSV/SD.h+SPIClass)
; superseded by map/SdCardManager.cpp + map/SpeedLimitManager.cpp — it
; references SD_CS_PIN/SD_MOSI_PIN/SD_SCK_PIN/SD_MISO_PIN, which no longer
; exist in pincfg.h now that the real hardware turned out to need SD_MMC
; pins instead (SD_MMC_CLK_PIN/CMD_PIN/D0_PIN), so it no longer compiles.
; Kept on disk for history, same "retired, not deleted" treatment as
; radar/SimTask.h, but excluded here instead of fixed forward since fixing
; it would just recreate the exact bug this file's replacement exists to
; not have.
build_src_filter = -<*> +<main_ui_demo.cpp> +<core/*> +<display/*> +<radar/*> +<gnss/*> +<touch/*> +<ui/*> +<net/*> +<map/*> +<log/*> +<audio/*> -<map/SpeedLimitMap.cpp>

; ABANDONED 2026-09-14 — do not build this env. Attempted esp_lcd migration
; (Arduino-ESP32 3.x / IDF 5.x via pioarduino, real partial-area screen
; writes) to fix the Arduino_GFX full-frame-flush ceiling. Seven independent
; hypotheses tried and eliminated on real hardware, screen stayed blank
; throughout — see docs/V1.2_hardening_proposal.md "Thử nghiệm esp_lcd" for
; the full writeup. Also: installing this platform overwrites the OTHER
; envs' shared "espressif32" platform install (pioarduino uses the same
; local platform name) — that's why env:jc3248w535 now pins an exact
; version. Kept only as reference for anyone resuming this investigation
; (needs a logic analyzer; see the doc for next steps).
[env:uidemo3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-n16r8v
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<main_ui_demo_esplcd.cpp>
build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
    lvgl/lvgl@9.2.2
