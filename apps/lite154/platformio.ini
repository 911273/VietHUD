[platformio]
boards_dir = boards
default_envs = waveshare_154

[env:waveshare_154]
platform = espressif32@7.1.3
board = waveshare_s3_lcd154
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM8
monitor_port = COM8

build_flags =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    mikalhart/TinyGPSPlus@1.1.0
